<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Study Planner Pro">
  <title>Study Planner Pro</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --surface: #121927;
      --surface-elevated: #1a2337;
      --surface-border: #24324f;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --overlay: rgba(5, 8, 15, 0.85);
      
      --brand-blue: #3b82f6;
      --brand-indigo: #6366f1;
      --brand-purple: #8b5cf6;
      --brand-cyan: #06b6d4;
      --brand-emerald: #10b981;
      
      --boards-accent: #38bdf8;
      --boards-deep: #0284c7;
      --ca-accent: #c084fc;
      --ca-deep: #9333ea;
      --cseet-accent: #34d399;
      --cseet-deep: #059669;
      
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --danger: #f43f5e;
      --warning: #fbbf24;
      --success: #10b981;
      
      --stage-1: #eab308;
      --stage-2: #a855f7;
      --stage-3: #3b82f6;
      --stage-4: #10b981;
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 25px rgba(59, 130, 246, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
    }

    button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; }
    :focus-visible { outline: 2px solid var(--brand-blue); outline-offset: 2px; border-radius: 8px; }

    /* HEADER */
    .top-bar {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .user-greeting { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .user-name { font-size: 19px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    
    .icon-badge-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 14px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .icon-badge-btn:active { transform: scale(0.92); }
    
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: var(--warning);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      z-index: 100;
      background: rgba(15, 23, 39, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--surface-border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      height: calc(62px + env(safe-area-inset-bottom, 0px));
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 700;
      gap: 4px;
      transition: color 0.2s ease;
    }
    .nav-btn.active { color: var(--brand-blue); }
    .nav-btn svg { width: 20px; height: 20px; stroke-width: 2.2; fill: none; stroke: currentColor; }

    /* LAYOUT & CARDS */
    .page { padding: 14px 16px 20px; max-width: 580px; margin: 0 auto; }
    
    .app-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft);
      position: relative;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: -0.2px; }
    .card-link { font-size: 11.5px; font-weight: 700; color: var(--brand-blue); background: none; }

    /* PROGRESS HERO WIDGET */
    .progress-hero {
      display: flex;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, rgba(30, 41, 67, 0.7), rgba(18, 25, 39, 0.95));
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-glow);
    }
    .radial-wrap {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: conic-gradient(var(--brand-cyan) calc(var(--p, 0) * 1%), var(--surface-elevated) 0);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .radial-center {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .radial-val { font-size: 15px; font-weight: 900; line-height: 1; color: #fff; }
    .hero-info { flex: 1; }
    .hero-title { font-size: 14px; font-weight: 800; margin-bottom: 3px; color: #fff; }
    .hero-sub { font-size: 11.5px; color: var(--text-muted); font-weight: 600; line-height: 1.4; }

    /* QUICK ACTIONS */
    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .quick-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .quick-btn:active { transform: scale(0.96); background: var(--surface-elevated); }
    .quick-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .quick-label { font-size: 11.5px; font-weight: 700; color: var(--text); }

    /* COUNTDOWNS */
    .countdown-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .cd-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
    }
    .cd-card.active-next { border-color: var(--brand-blue); box-shadow: 0 0 14px rgba(59, 130, 246, 0.25); }
    .cd-days { font-size: 22px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .cd-label { font-size: 10px; font-weight: 800; margin-top: 5px; text-transform: uppercase; }
    .cd-sub { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

    /* SEGMENTED CONTROLS */
    .segmented {
      display: flex;
      gap: 6px;
      background: var(--surface-elevated);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border-subtle);
    }
    .segmented-btn {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-dim);
      font-weight: 700;
      font-size: 12px;
      padding: 8px 4px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .segmented-btn.active {
      background: var(--brand-blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }

    /* SEARCH & CHIPS */
    .search-input-wrap { position: relative; margin-bottom: 12px; }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input.with-icon { padding-left: 36px; }
    .form-input:focus { border-color: var(--brand-blue); }

    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* SYLLABUS SUBJECT CARDS */
    .portion-item-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .portion-item-card:hover { background: var(--surface-elevated); }
    .sub-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .sub-meta { flex: 1; min-width: 0; }
    .sub-heading { font-size: 13.5px; font-weight: 800; color: #fff; margin-bottom: 3px; }
    .sub-counts { font-size: 11px; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
    .bar-line {
      height: 5px;
      border-radius: 10px;
      background: var(--surface-elevated);
      overflow: hidden;
    }
    .bar-line-fill { height: 100%; border-radius: 10px; transition: width 0.3s ease; }
    .sub-arrow-pct { text-align: right; }
    .sub-pct-val { font-size: 12px; font-weight: 800; color: var(--text-muted); }

    /* CHAPTER/UNIT LISTS */
    .item-unit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .unit-name-txt { font-size: 12.5px; font-weight: 600; color: #fff; line-height: 1.35; flex: 1; }
    .unit-sub-txt { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }

    /* TICK STRIPS */
    .tick-strip { display: flex; gap: 4px; align-items: center; }
    .tick-box {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--surface-border);
      background: var(--surface);
      display: grid;
      place-items: center;
      font-size: 9.5px;
      font-weight: 900;
      color: var(--text-dim);
      transition: transform 0.12s ease;
    }
    .tick-box:active { transform: scale(0.88); }
    .tick-box.done-1 { background: var(--stage-1); border-color: var(--stage-1); color: #000; }
    .tick-box.done-2 { background: var(--stage-2); border-color: var(--stage-2); color: #fff; }
    .tick-box.done-3 { background: var(--stage-3); border-color: var(--stage-3); color: #fff; }
    .tick-box.done-4 { background: var(--stage-4); border-color: var(--stage-4); color: #000; }

    .action-icon-btn {
      background: none;
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      border-radius: 7px;
      width: 26px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      position: relative;
    }
    .badge-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ca-accent);
      border: 1px solid var(--surface);
    }

    /* FOCUS TIMER WIDGET (Image Inspired) */
    .timer-center-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 0 18px;
    }
    .timer-ring-large {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: conic-gradient(var(--brand-purple) calc(var(--p, 0) * 1%), var(--surface-elevated) 0);
      display: grid;
      place-items: center;
      box-shadow: 0 0 35px rgba(139, 92, 246, 0.25);
      position: relative;
    }
    .timer-ring-inner {
      width: 184px;
      height: 184px;
      border-radius: 50%;
      background: #0d121c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .timer-stage-title { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .timer-numbers { font-size: 42px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }
    .timer-play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--brand-indigo);
      display: grid;
      place-items: center;
      font-size: 16px;
      color: #fff;
      margin-top: 4px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s ease;
    }
    .timer-play-btn:active { transform: scale(0.92); }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 18px 0 12px;
    }
    .preset-box {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
    }
    .preset-box.active {
      border-color: var(--brand-blue);
      background: rgba(59, 130, 246, 0.15);
    }
    .preset-time { font-size: 13.5px; font-weight: 800; color: #fff; }
    .preset-lbl { font-size: 10px; font-weight: 700; color: var(--text-dim); margin-top: 2px; }

    /* TARGETS & LISTS */
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .task-row:last-child { border-bottom: none; }
    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--surface-border);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      color: #000;
      flex-shrink: 0;
      cursor: pointer;
    }
    .task-check.checked { background: var(--success); border-color: var(--success); }
    .task-label { flex: 1; font-size: 13px; font-weight: 600; color: #fff; }
    .task-label.done { text-decoration: line-through; color: var(--text-dim); }
    .tag-badge {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
    }

    /* BUTTONS */
    .btn {
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-full { width: 100%; }
    .btn-brand { background: var(--brand-blue); color: #fff; }
    .btn-dark { background: var(--surface-elevated); border: 1px solid var(--surface-border); color: var(--text-muted); }
    .btn-danger { background: rgba(244, 63, 94, 0.14); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }

    /* MODALS */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.active { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }
    .modal-box.center { border-radius: 24px; align-self: center; margin: 16px; max-height: 82vh; }
    .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    .modal-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    .modal-group { margin-bottom: 12px; }
    .modal-lbl { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions .btn { flex: 1; }

    /* TOAST */
    #toastWrap {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      padding: 0 16px;
    }
    .toast {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      color: #fff;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
    }
    .notes-media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .media-card { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--surface-elevated); }
    .media-card img { width: 100%; height: 100%; object-fit: cover; }
    .media-del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.7); border: none; border-radius: 50%; color: var(--danger); width: 22px; height: 22px; }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="top-bar">
    <div>
      <div class="user-greeting">Good Morning,</div>
      <div class="user-name" id="headerUserName">Student</div>
    </div>
    <div class="top-actions">
      <div class="streak-badge" id="streakBadge">🔥 0d</div>
      <button class="icon-badge-btn" onclick="openModal('settingsModal')" title="Settings">⚙️</button>
      <button class="icon-badge-btn" onclick="openTargetModal()" title="Add target">＋</button>
    </div>
  </header>

  <!-- MAIN TAB CONTAINERS -->
  <main id="tabOverview" class="page"></main>
  <main id="tabPortions" class="page" style="display:none"></main>
  <main id="tabBacklog" class="page" style="display:none"></main>
  <main id="tabTests" class="page" style="display:none"></main>
  <main id="tabStats" class="page" style="display:none"></main>

  <!-- BOTTOM BAR NAVIGATION (Matches Prototype) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navBtn-overview" onclick="switchNav('overview')">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Today
    </button>
    <button class="nav-btn" id="navBtn-portions" onclick="switchNav('portions')">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Portions
    </button>
    <button class="nav-btn" id="navBtn-backlog" onclick="switchNav('backlog')">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Backlog
    </button>
    <button class="nav-btn" id="navBtn-tests" onclick="switchNav('tests')">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
      Tests
    </button>
    <button class="nav-btn" id="navBtn-stats" onclick="switchNav('stats')">
      <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
      Analytics
    </button>
  </nav>

  <!-- TARGET MODAL -->
  <div class="modal-backdrop" id="targetModal">
    <div class="modal-box">

    function switchNav(nav) {
      currentNav = nav;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = $('navBtn-' + nav);
      if (activeBtn) activeBtn.classList.add('active');
      ['overview', 'portions', 'backlog', 'tests', 'stats'].forEach(p => {
        const el = $('tab' + p.charAt(0).toUpperCase() + p.slice(1));
        if (el) el.style.display = p === nav ? 'block' : 'none';
      });
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      $('headerUserName').textContent = STATE.userName || 'Student';
      if (currentNav === 'overview') renderOverview();
      if (currentNav === 'portions') renderPortions();
      if (currentNav === 'backlog') renderBacklog();
      if (currentNav === 'tests') renderTests();
      if (currentNav === 'stats') renderStats();
    }

    const SUB_ICONS = {

      b_maths_combined: { icon: '📐', bg: 'rgba(59,130,246,0.2)', color: '#60a5fa' },

      b_ocm: { icon: '🏢', bg: 'rgba(251,191,36,0.15)', color: '#fbbf24' },
      b_eng: { icon: '📖', bg: 'rgba(244,63,94,0.15)', color: '#fb7185' },

    let selectedSubjectForDetail = null;

    function renderPortions() {

          });

      const sub = (SYLLABUS[portionStream] || []).find(s => s.id === subId);

      const items = INDEX.filter(it => it.stream === portionStream && it.subId === subId);

      return `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <button class="icon-badge-btn" onclick="selectedSubjectForDetail=null;renderPortions()">‹</button>
          <span style="font-size:15px;font-weight:800">${esc(sub.name)}</span>
        </div>
        <div>
          ${items.map(it => {
            const st = STATE.ticks[it.key] || 0;
            const hasNotes = !!(STATE.topicNotes[it.key] || STATE.mediaCounts[it.key]);
            return `
              <div class="item-unit-row">
                <div class="unit-name-txt">
                  ${esc(it.name)}
                </div>
                <div style="display:flex;align-items:center;gap:6px">

                  <div class="tick-strip">
                    ${[1,2,3,4].map(num => `

                    `).join('')}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

        <div class="app-card">
          <div class="card-header">
            <span class="card-title">Backlog & Unfinished Tasks</span>

      $('tabBacklog').innerHTML = h;

      const val = $('backlogInput').value.trim();
      if (!val) return;
      STATE.backlog.push({ text: val, priority: 'High', date: todayStr() });
      save(); renderBacklog();
    }
    function moveBacklogToToday(i) {
      const item = STATE.backlog[i];
      STATE.targets.push({ id: uid(), text: item.text, stream: '12th', done: false });
      STATE.backlog.splice(i, 1);
      save(); renderBacklog();
      toast('Moved to today');
    }
    function deleteBacklog(i) {
      STATE.backlog.splice(i, 1);
      save(); renderBacklog();
    }

        <div class="app-card">

    /* =========================================================================
       VIEW 5: STATS & ANALYTICS (MATCHING IMAGE SCREEN 6)
       ========================================================================= */
    function renderStats() {
      const todayTotal = todayStudySeconds();
      const hToday = (todayTotal / 3600).toFixed(1);
      
      let h = `
        <div class="app-card">
          <div class="card-header">
            <span class="card-title">Study Hours</span>

          <div style="font-size:28px;font-weight:900;margin-bottom:8px">${hToday}h <span style="font-size:12px;color:var(--text-dim)">Today</span></div>

              <div style="margin-bottom:12px">

                  <span>${name}</span>
                  <span style="color:var(--brand-blue)">75%</span>
                </div>
                <div class="bar-line"><div class="bar-line-fill" style="width:75%;background:var(--brand-blue)"></div></div>
              </div>

      $('tabStats').innerHTML = h;

    /* =========================================================================
       TIMER CONTROLLER
       ========================================================================= */
    let timerInterval = null;
    function isTimerRunning() { return !!STATE.timer.since; }
    function getTimerSeconds() {
      const t = STATE.timer;
      const running = t.since ? (Date.now() - t.since)/1000 : 0;
      if (t.mode === 'pomo') {
        return Math.max(0, t.targetSec - (t.acc + running));
      }
      return t.acc + running;
    }
    function getTimerProgress() {
      const t = STATE.timer;
      if (t.mode === 'pomo') {
        const rem = getTimerSeconds();
        return Math.round(((t.targetSec - rem) / t.targetSec) * 100);
      }
      return Math.min(100, Math.round((getTimerSeconds() / 3600) * 100));
    }
    function toggleTimer() {
      const t = STATE.timer;
      if (t.since) {
        t.acc += (Date.now() - t.since) / 1000;
        t.since = null;
      } else {
        t.since = Date.now();
      }
      save(); render();
    }
    function setPresetTimer(sec) {
      const t = STATE.timer;
      if (t.since) t.acc += (Date.now() - t.since) / 1000;
      t.since = null;
      t.acc = 0;
      t.targetSec = sec;
      t.mode = 'pomo';
      save(); render();
    }
    function todayStudySeconds() {
      const t = STATE.dailyLogs[todayStr()] || 0;
      const cur = STATE.timer.acc + (STATE.timer.since ? (Date.now() - STATE.timer.since)/1000 : 0);
      return Math.round(t + cur);
    }
    function fmtClock(s) {
      s = Math.max(0, Math.floor(s));
      const m = Math.floor(s / 60), sec = s % 60;
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }
    function fmtHours(s) {
      const h = s / 3600;
      if (h < 1) return Math.round(s / 60) + 'm';
      return (Math.round(h * 10) / 10) + 'h';
    }

    /* =========================================================================
       HELPERS & MODALS
       ========================================================================= */
    function setPortionStream(s) { portionStream = s; selectedSubjectForDetail = null; render(); }
    function getDaysTo(dStr) {
      if (!dStr) return '—';
      const diff = new Date(dStr + 'T00:00:00').getTime() - Date.now();
      return Math.max(0, Math.ceil(diff / 86400000));
    }
    function setStage(key, st) {
      const cur = STATE.ticks[key] || 0;
      STATE.ticks[key] = cur === st ? st - 1 : st;
      STATE.tickMeta[key] = Date.now();
      playChime(); save(); render();
    }
    function toggleTargetDone(id) {
      const t = STATE.targets.find(x => x.id === id);
      if (t) { t.done = !t.done; save(); render(); playChime(); }
    }
    function deleteTarget(id) {
      STATE.targets = STATE.targets.filter(x => x.id !== id);
      save(); render();
    }

    let activeNotesKey = null;
    function openNotes(key) {
      activeNotesKey = key;
      const it = INDEX_BY_KEY[key];
      $('notesModalTitle').textContent = it ? it.name : 'Notes';
      $('notesModalSub').textContent = it ? it.subName : '';
      $('topicNoteText').value = STATE.topicNotes[key] \vert{}\vert{} '';$('mediaCount').textContent = STATE.mediaCounts[key] || 0;
      openModal('notesModal');
    }
    function saveTopicNotes() {
      if (!activeNotesKey) return;
      const val = $('topicNoteText').value.trim();
      if (val) STATE.topicNotes[activeNotesKey] = val;
      else delete STATE.topicNotes[activeNotesKey];
      save(); closeModal('notesModal'); render();
    }

    function openTargetModal() {
      populatePickSubjects();
      openModal('targetModal');
    }
    function setTargetCreationMode(m) {
      $('portionSelectWrapper').style.display = m === 'portion' ? 'block' : 'none';$('customInputWrapper').style.display = m === 'custom' ? 'block' : 'none';
      $('btnModePortion').className = 'btn ' + (m === 'portion' ? 'btn-brand' : 'btn-dark');$('btnModeCustom').className = 'btn ' + (m === 'custom' ? 'btn-brand' : 'btn-dark');
    }
    function populatePickSubjects() {
      const stream = $('pickStream').value;
      $('pickSubject').innerHTML = (SYLLABUS[stream] || []).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      populatePickChapters();
    }
    function populatePickChapters() {
      const stream = $('pickStream').value;
      const sub = (SYLLABUS[stream] || []).find(s => s.id === $('pickSubject').value);
      if (!sub) return;
      if (sub.flat) {
        $('pickUnitGroup').style.display = 'none';$('pickChapter').innerHTML = sub.chapters.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('');
      } else {
        $('pickUnitGroup').style.display = 'block';$('pickChapter').innerHTML = sub.chapters.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        populatePickUnits();
      }
    }
    function populatePickUnits() {
      const stream = $('pickStream').value;
      const sub = (SYLLABUS[stream] || []).find(s => s.id === $('pickSubject').value);
      if (!sub || sub.flat) return;
      const chp = sub.chapters.find(c => c.id === $('pickChapter').value);
      if (!chp) return;
      $('pickUnit').innerHTML = chp.units.map((u, i) => `<option value="${i}">${esc(u)}</option>`).join('');
    }
    function submitTarget() {
      const isPortion = $('portionSelectWrapper').style.display !== 'none';
      let title = '';
      if (isPortion) {
        const stream = $('pickStream').value;
        const sub = (SYLLABUS[stream] || []).find(s => s.id === $('pickSubject').value);
        if (sub.flat) {
          title = sub.chapters[Number($('pickChapter').value)];
        } else {
          const chp = sub.chapters.find(c => c.id === $('pickChapter').value);
          title = chp.units[Number($('pickUnit').value)];
        }
      } else {
        title = $('tgtCustomText').value.trim();
      }
      if (!title) return toast('Please specify task name');
      STATE.targets.push({ id: uid(), text: title, stream: '12th', done: false });
      save(); closeModal('targetModal'); render();
      toast('Target added');
    }

    function populateTestSubjects() {
      const str = $('testStream').value;
      $('testSubjectSelect').innerHTML = (SYLLABUS[str] || []).map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
    }
    function submitTestRecord() {
      const sc = Number($('testScore').value), tot = Number($('testTotal').value);
      if (!tot) return toast('Enter valid total');
      STATE.tests.unshift({
        subject: $('testSubjectSelect').value,
        topic: $('testTopic').value.trim() || 'Paper',
        score: sc, total: tot, date: todayStr()
      });
      save(); closeModal('testModal'); render();
      toast('Score saved');
    }

    function openModal(id) { $(id).classList.add('active'); }
    function closeModal(id) { $(id).classList.remove('active'); }
    function toast(m) {
      const w = $('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast'; el.textContent = m;
      w.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }
    function exportJSONBackup() {
      const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `studyplanner-pro-backup-${todayStr()}.json`;
      a.click(); toast('Backup saved');
    }
    function restoreFromFile(inp) {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          STATE = Object.assign(STATE, JSON.parse(r.result));
          save(); render(); closeModal('settingsModal'); toast('Data restored!');
        } catch(e) { toast('Invalid backup file'); }
      };
      r.readAsText(file);
    }

    /* LOOP */
    setInterval(() => {
      if (isTimerRunning()) {
        const cd = $('clockDigits');
        if (cd) cd.textContent = fmtClock(getTimerSeconds());
      }
    }, 1000);

    /* BOOT */
    loadState();
    switchNav('overview');
  </script>
</body>
</html>
